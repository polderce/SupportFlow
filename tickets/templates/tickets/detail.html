<!DOCTYPE html>
<html>
<head>
    <title>Просмотр тикета</title>
</head>
<body>
    <h1>Тикет №{{ ticket.id }}</h1>
    <ul>
        <li>{{ ticket.title }}</li>
        <li>{{ ticket.category }}</li>
        <li>{{ ticket.description }}</li>
        <li>{{ ticket.status }}</li>
        <li>{{ ticket.created_at }}</li>
    </ul>
    <a href="{% url 'ticket-change' pk=ticket.id %}">Изменить тикет</a>
</body>
</html>
