{% extends "base.html" %}

{% block title %}Редактирование тикета №{{ ticket.pk }}{% endblock %}
{% block content %}
    <div class="d-flex justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h1 class="d-flex justify-content-center">Тикет №{{ ticket.pk }}</h1>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
